name: Build OrangeFox Recovery (sagit)

# Builds OrangeFox Recovery for Xiaomi Mi 6 (sagit) from THIS device tree.
#
#   fox_branch 14.1 -> OrangeFox R12.x  (Android 14 base, TWRP 14.1)
#   fox_branch 12.1 -> OrangeFox R11.x  (Android 12.1 base, TWRP 12.1)
#
# The device tree is NOT cloned from a URL: whatever is checked out in this
# repository is rsynced into device/xiaomi/sagit, so a run always builds the
# commit you are looking at.
#
# Disk: 14.1 needs roughly 85 GB after sync, 12.1 roughly 45 GB. The
# free-space step reclaims about 25 GB on the hosted runner.
#
# Credits:
#   https://github.com/TeamWin
#   https://gitlab.com/OrangeFox
#   https://github.com/azwhikaru (Recovery Builder Template)

on:
  workflow_dispatch:
    inputs:
      fox_branch:
        description: 'OrangeFox manifest branch (14.1 = R12.x/Android 14, 12.1 = R11.x)'
        required: true
        default: '14.1'
        type: choice
        options:
          - '14.1'
          - '12.1'
      build_target:
        description: 'Image to build'
        required: true
        default: 'recovery'
        type: choice
        options:
          - recovery
          - boot
          - vendorboot
      swap_gb:
        description: 'Swap file size in GB (0 disables; the swap file counts against free disk)'
        required: true
        default: '8'
  push:
    branches:
      - main
      - fox_14.1
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ inputs.fox_branch || '14.1' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 355

    env:
      DEVICE: sagit
      DEVICE_PATH: device/xiaomi/sagit
      FOX_BRANCH: ${{ inputs.fox_branch || '14.1' }}
      BUILD_TARGET: ${{ inputs.build_target || 'recovery' }}
      SWAP_GB: ${{ inputs.swap_gb || '8' }}
      SRC: /home/runner/fox
      OUT: /home/runner/fox/out/target/product/sagit
      RECOVERY_PARTITION_SIZE: 67108864 # 64 MiB, from BoardConfig.mk
      TZ: Asia/Shanghai

    steps:
      - name: Check out device tree
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Environment
      # ------------------------------------------------------------------
      - name: Free disk space
        run: |
          echo "=== before ==="
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/share/powershell || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          echo "=== after ==="
          df -h /

          AVAIL_GB=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "available: ${AVAIL_GB} GB"
          if [ "$AVAIL_GB" -lt 70 ]; then
            echo "::error::only ${AVAIL_GB} GB free, need at least 70 GB"
            exit 1
          fi

      - name: Set swap space
        if: env.SWAP_GB != '0'
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: ${{ env.SWAP_GB }}

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            aria2 bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick libelf-dev liblz4-tool libncurses5 \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" --version

      # ------------------------------------------------------------------
      # Sync OrangeFox sources
      # ------------------------------------------------------------------
      - name: Sync OrangeFox fox_${{ env.FOX_BRANCH }}
        run: |
          set -o pipefail
          git config --global user.name  "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git config --global color.ui false

          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git -b master "$RUNNER_TEMP/of_sync"
          cd "$RUNNER_TEMP/of_sync"

          # Must run from inside the sync repo (it reads patches/) and --path
          # must be absolute.
          ./orangefox_sync.sh --branch "$FOX_BRANCH" --path "$SRC" 2>&1 | tee "$RUNNER_TEMP/sync.log"

          echo "=== disk after sync ==="
          df -h /
          du -sh "$SRC" 2>/dev/null || true

      # ------------------------------------------------------------------
      # Drop this device tree in place
      # ------------------------------------------------------------------
      - name: Place device tree
        run: |
          mkdir -p "$SRC/device/xiaomi"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='artifacts' \
            "$GITHUB_WORKSPACE/" "$SRC/$DEVICE_PATH/"
          echo "=== device tree ==="
          find "$SRC/$DEVICE_PATH" -type f | sed "s|$SRC/||" | sort

      - name: Fetch prebuilt kernel and vendor blobs
        run: |
          bash "$SRC/$DEVICE_PATH/scripts/fetch_blobs.sh" "$SRC/$DEVICE_PATH"

      - name: Add task_profiles.json
        run: |
          # fox_14.1 needs this for logd/logcat inside recovery. LineageOS 21
          # ships the same file as system/core/libprocessgroup/profiles/
          # task_profiles_28.json - copy it if the synced tree has it.
          SRC_JSON="$SRC/system/core/libprocessgroup/profiles/task_profiles_28.json"
          DST="$SRC/$DEVICE_PATH/recovery/root/system/etc/task_profiles.json"
          if [ -f "$SRC_JSON" ]; then
            mkdir -p "$(dirname "$DST")"
            cp -v "$SRC_JSON" "$DST"
          else
            echo "::warning::task_profiles.json not in the synced tree - logcat inside recovery will not work"
          fi

      - name: Sanity check device tree
        run: |
          D="$SRC/$DEVICE_PATH"
          fail=0
          for f in AndroidProducts.mk BoardConfig.mk vendorsetup.sh prebuilt/Image.gz-dtb; do
            if [ -e "$D/$f" ]; then
              echo "  ok      $f"
            else
              echo "  MISSING $f"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::the device tree is incomplete, refusing to build"
            exit 1
          fi

          if ! grep -q "twrp_${DEVICE}" "$D/AndroidProducts.mk"; then
            echo "::error::AndroidProducts.mk does not declare twrp_${DEVICE}"
            exit 1
          fi

      # ------------------------------------------------------------------
      # Build
      # ------------------------------------------------------------------
      - name: Build OrangeFox
        run: |
          set -o pipefail
          cd "$SRC"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          # envsetup.sh returns non-zero on some paths even when it succeeds
          set +e
          source build/envsetup.sh
          set -e

          # ---- pick a lunch combo -------------------------------------------
          # fox_14.1 ships the Android 14 QPR3 build system, whose lunch only
          # accepts <product>-<release>-<variant>:
          #   IFS="-" read -r product release variant <<< "$selection"
          #   [[ -z "$variant" ]] && echo "Invalid lunch combo: ..."
          # so "twrp_sagit-eng" is rejected (release=eng, variant empty).
          # 12.1 and 11.0 still accept the 2-part form, so try that first.
          COMBO=""
          if lunch "twrp_${DEVICE}-eng" >/dev/null 2>&1; then
            COMBO="twrp_${DEVICE}-eng"
          else
            mapdir="$SRC/build/release/release_config_map.d"
            releases=""
            if [ -d "$mapdir" ]; then
              releases=$(ls "$mapdir" 2>/dev/null | sed -n 's/\.textproto$//p')
            fi
            [ -n "$releases" ] || releases="trunk_staging bp1a ap3a next experimental"
            echo "release configs found: $(echo $releases | tr '\n' ' ')"
            for rel in $releases; do
              echo "--- trying twrp_${DEVICE}-${rel}-eng"
              if lunch "twrp_${DEVICE}-${rel}-eng" >/dev/null 2>&1; then
                COMBO="twrp_${DEVICE}-${rel}-eng"
                break
              fi
            done
          fi

          if [ -z "$COMBO" ]; then
            echo "::error::could not find a valid lunch combo"
            echo "release configs available in the tree:"
            ls "$SRC/build/release/release_config_map.d" 2>/dev/null || echo "(none)"
            exit 1
          fi

          echo "==> lunch combo: $COMBO"
          lunch "$COMBO"

          mka adbd "${BUILD_TARGET}image" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # ------------------------------------------------------------------
      # Collect + verify (runs even on failure so logs survive)
      # ------------------------------------------------------------------
      - name: Collect artifacts
        if: always()
        run: |
          ART="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ART"

          echo "=== $OUT ==="
          ls -lh "$OUT" 2>/dev/null || echo "(no output directory)"

          shopt -s nullglob
          files=("$OUT"/OrangeFox*)
          for f in "${files[@]}"; do
            cp -v "$f" "$ART/"
          done

          cp -v "$GITHUB_WORKSPACE/build.log" "$ART/" 2>/dev/null || true
          cp -v "$RUNNER_TEMP/sync.log" "$ART/" 2>/dev/null || true

          echo "=== artifacts ==="
          ls -lh "$ART" || true

          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no OrangeFox image was produced"
            exit 1
          fi

          for f in "${files[@]}"; do
            size=$(stat -c%s "$f")
            echo "$(basename "$f"): $size bytes (partition limit $RECOVERY_PARTITION_SIZE)"
            if [ "$size" -gt "$RECOVERY_PARTITION_SIZE" ]; then
              echo "::error::$(basename "$f") exceeds the 64 MiB recovery partition - enable OF_USE_LZMA_COMPRESSION=1 or trim features"
            fi
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-${{ env.DEVICE }}-${{ env.FOX_BRANCH }}-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Create release
        if: success() && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/OrangeFox*
          name: OrangeFox fox_${{ env.FOX_BRANCH }} for ${{ env.DEVICE }} // ${{ github.run_number }}
          tag_name: ofr-${{ env.DEVICE }}-${{ github.run_id }}
          fail_on_unmatched_files: false
          body: |
            ## OrangeFox Recovery — Unofficial build

            | | |
            |---|---|
            | Manifest branch | `fox_${{ env.FOX_BRANCH }}` |
            | Device | `${{ env.DEVICE }}` |
            | Device tree commit | [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |
            | Build target | `${{ env.BUILD_TARGET }}image` |
            | Run | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            Flash with:
            ```sh
            fastboot flash recovery OrangeFox-*.img
            ```

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Build summary"
            echo ""
            echo "| item | value |"
            echo "|---|---|"
            echo "| branch | \`fox_${FOX_BRANCH}\` |"
            echo "| device | \`${DEVICE}\` |"
            echo "| target | \`${BUILD_TARGET}image\` |"
            echo "| status | ${{ job.status }} |"
            echo ""
            echo '```'
            ls -lh "$OUT" 2>/dev/null | head -20 || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
