name: Build OrangeFox Recovery (sagit)

# Builds OrangeFox Recovery for Xiaomi Mi 6 (sagit) from the device tree in
# this repository.
#
#   fox_branch 14.1 -> OrangeFox R12.x   (Android 14 base, TWRP 14.1)
#   fox_branch 12.1 -> OrangeFox R11.x   (Android 12.1 base, TWRP 12.1)
#
# 14.1 needs ~85 GB of disk and a very long sync; the free-space step below
# reclaims roughly 25 GB on the hosted runner.

on:
  workflow_dispatch:
    inputs:
      fox_branch:
        description: "OrangeFox source branch (14.1 = R12.x/Android 14, 12.1 = R11.x/Android 12.1)"
        required: true
        default: "14.1"
        type: choice
        options:
          - "14.1"
          - "12.1"
      fox_build_type:
        description: "Build type label shown in the OrangeFox UI"
        required: false
        default: "Unofficial"
        type: string
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"

# A single run is enough; cancel stale ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ github.event.inputs.fox_branch || '14.1' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 355

    env:
      DEVICE: sagit
      FOX_BRANCH: ${{ github.event.inputs.fox_branch || '14.1' }}
      FOX_TYPE: ${{ github.event.inputs.fox_build_type || 'Unofficial' }}
      SRC: /home/runner/fox
      RECOVERY_PARTITION_SIZE: 67108864 # 64 MiB, from BoardConfig.mk

    steps:
      - name: Check out device tree
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Environment
      # ------------------------------------------------------------------
      - name: Free disk space
        run: |
          echo "=== before ==="
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          echo "=== after ==="
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick libelf-dev liblz4-tool libncurses5 \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" --version

      # ------------------------------------------------------------------
      # Sync OrangeFox sources
      # ------------------------------------------------------------------
      - name: Sync OrangeFox ${{ env.FOX_BRANCH }} sources
        run: |
          set -o pipefail
          git config --global user.name  "GitHub Actions"
          git config --global user.email "actions@users.noreply.github.com"
          git config --global color.ui false

          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git "$HOME/fox_sync"
          cd "$HOME/fox_sync"

          # The script must be run from inside the sync repo (it reads patches/)
          # and --path must be absolute.
          ./orangefox_sync.sh --branch "$FOX_BRANCH" --path "$SRC" 2>&1 | tee "$HOME/sync.log"

          echo "=== disk after sync ==="
          df -h /
          du -sh "$SRC" || true

      # ------------------------------------------------------------------
      # Drop the device tree in place
      # ------------------------------------------------------------------
      - name: Place device tree
        run: |
          mkdir -p "$SRC/device/xiaomi"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            "$GITHUB_WORKSPACE/" "$SRC/device/xiaomi/$DEVICE/"
          echo "=== device tree ==="
          find "$SRC/device/xiaomi/$DEVICE" -type f | sort

      - name: Add task_profiles.json
        run: |
          # fox_14.1 needs this for logd/logcat inside recovery. LineageOS 21
          # ships the same file as system/core/libprocessgroup/profiles/
          # task_profiles_28.json - copy it if the synced tree has it.
          SRC_JSON="$SRC/system/core/libprocessgroup/profiles/task_profiles_28.json"
          DST="$SRC/device/xiaomi/$DEVICE/recovery/root/system/etc/task_profiles.json"
          if [ -f "$SRC_JSON" ]; then
            mkdir -p "$(dirname "$DST")"
            cp -v "$SRC_JSON" "$DST"
          else
            echo "::warning::task_profiles.json not in the synced tree - logcat inside recovery will not work"
          fi

      - name: Fetch prebuilt kernel and vendor blobs
        run: |
          bash "$SRC/device/xiaomi/$DEVICE/scripts/fetch_blobs.sh" \
               "$SRC/device/xiaomi/$DEVICE"

      # ------------------------------------------------------------------
      # Build
      # ------------------------------------------------------------------
      - name: Build recovery image
        run: |
          set -o pipefail
          cd "$SRC"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export FOX_BUILD_TYPE="$FOX_TYPE"

          source build/envsetup.sh
          lunch "twrp_${DEVICE}-eng"
          mka adbd recoveryimage 2>&1 | tee "$HOME/build.log"

      # ------------------------------------------------------------------
      # Collect results (also on failure, so the log is always available)
      # ------------------------------------------------------------------
      - name: Collect artifacts
        if: always()
        run: |
          set -o pipefail
          OUT_DIR="$SRC/out/target/product/$DEVICE"
          ART="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ART"

          if [ -d "$OUT_DIR" ]; then
            find "$OUT_DIR" -maxdepth 1 -type f \
              \( -name 'OrangeFox-*' -o -name 'recovery.img' -o -name 'recovery-*.img' \) \
              -exec cp -v {} "$ART/" \;
          fi

          cp -v "$HOME/build.log" "$ART/" 2>/dev/null || true
          cp -v "$HOME/sync.log"  "$ART/" 2>/dev/null || true

          echo "=== artifacts ==="
          ls -lh "$ART" || true

          for img in "$ART"/*.img; do
            [ -e "$img" ] || continue
            size=$(stat -c%s "$img")
            echo "$(basename "$img"): $size bytes (limit $RECOVERY_PARTITION_SIZE)"
            if [ "$size" -gt "$RECOVERY_PARTITION_SIZE" ]; then
              echo "::error::$(basename "$img") exceeds the 64 MiB recovery partition - enable OF_USE_LZMA_COMPRESSION=1 or trim features"
            fi
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-${{ env.DEVICE }}-${{ env.FOX_BRANCH }}
          path: |
            artifacts/*
          if-no-files-found: warn
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.img
          generate_release_notes: true
          fail_on_unmatched_files: false
